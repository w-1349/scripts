name: AGH_去重更新

on:
  schedule:
    - cron: '49 5 * * *'   # 北京时间每天 13:49
  workflow_dispatch:

# 防止与另一个 workflow 同时运行冲突
concurrency:
  group: agh-update-workflow
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  convert-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Python 3.11环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装脚本依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行AGH规则合并脚本
        run: python scripts/adguard.py

      - name: 配置Git身份并强制推送
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # 只添加 AGH 相关的文件（避免误加其他文件）
          git add Loon.lsr Loon.log adguard-home*.txt *.conf rules*.txt || true

          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit and push."
            exit 0
          fi

          git commit -m "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S') [AGH]"

          git pull --rebase origin main || true

          # 强制推送，保证 AGH 最新规则覆盖上去
          git push origin main --force-with-lease
          # git push origin main --force   # 如果你想更硬核，可以改用这行

name: Loon_定时更新

on:
  schedule:
    - cron: '49 5 * * *'   # 北京时间每天 13:49
  workflow_dispatch:

# 单独的 concurrency group，与 AGH 使用不同的 group
concurrency:
  group: loon-update-workflow
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: 执行合并脚本
        run: python scripts/loon.py

      - name: 配置Git身份并强制推送
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # 只添加 Loon 相关文件
          git add Loon.lsr Loon.log || true

          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit and push."
            exit 0
          fi

          git commit -m "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S') [Loon]"

          git pull --rebase origin main || true

          # 强制推送（保证 Loon 最新内容覆盖上去）
          git push origin main --force-with-lease

rules:
  # ============================================================
  # 规则1：在家（SSID 为 ROG）时，整个 192.168.0.0/16 局域网直连
  # ------------------------------------------------------------
  # 逻辑：SSID = ROG  并且  目标IP属于 192.168.0.0/16
  # 作用：连接家里 Wi-Fi（ROG）时，访问局域网设备全部走 DIRECT，
  #       不经过代理/虚拟组网，延迟最低、最稳定。
  # 说明：Egern 的 ssid 匹配不区分大小写，写 ROG 即可覆盖 rog。
  # ============================================================
  - and:
      match:
        - ssid:
            match: ROG
        - ip_cidr:
            match: 192.168.0.0/16
            no_resolve: true   # 纯 IP 规则，禁止 DNS 解析，减少延迟
      policy: DIRECT

  # ============================================================
  # 规则2：不在家时，指定网段走「回家节点」
  # ------------------------------------------------------------
  # 逻辑：目标IP属于 192.168.9.0/24  或  192.168.54.0/24
  # 作用：离开家里 Wi-Fi 后，访问这两个远程局域网网段时，
  #       走「回家节点」策略（通常是 VPN / 隧道节点），
  #       实现远程访问家里设备。
  # 注意：这两个 /24 都包含在 192.168.0.0/16 内，
  #       所以在家时会被上面的规则1优先命中并直连。
  # ============================================================
  - or:
      match:
        - ip_cidr:
            match: 192.168.9.0/24
            no_resolve: true
        - ip_cidr:
            match: 192.168.54.0/24
            no_resolve: true
      policy: 回家节点
